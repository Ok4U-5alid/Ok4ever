<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local AI Chat</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🦙</text></svg>">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, sans-serif;
    background: #14161f; color: #e6e8ef;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: .8rem 1.2rem; display: flex; flex-wrap: wrap; gap: .6rem 1rem; align-items: center;
    background: #1b1e2b; border-bottom: 1px solid #2a2e40;
  }
  header h1 { font-size: 1rem; font-weight: 600; flex: 1; }
  header select, header button, footer select {
    font: inherit; background: #262a3c; color: #e6e8ef;
    border: 1px solid #3a3f58; border-radius: 6px; padding: .35rem .7rem;
  }
  header span { color: #7f869c; font-size: .8rem; }
  label.opt { display: flex; gap: .35rem; align-items: center; font-size: .8rem; color: #aab0c4; cursor: pointer; }
  #log { flex: 1; overflow-y: auto; padding: 1.2rem; display: flex; flex-direction: column; gap: .8rem; }
  .msg { max-width: 80%; padding: .6rem .9rem; border-radius: 10px; white-space: pre-wrap; line-height: 1.45; }
  .user   { align-self: flex-end; background: #2f5af0; color: #fff; }
  .bot    { align-self: flex-start; background: #232738; }
  .note   { align-self: center; color: #7f869c; font-size: .78rem; }
  #chips { display: flex; flex-wrap: wrap; gap: .4rem; padding: .5rem .8rem 0; background: #1b1e2b; border-top: 1px solid #2a2e40; }
  #chips:empty { display: none; }
  .chip { background: #262a3c; border: 1px solid #3a3f58; border-radius: 999px; padding: .15rem .3rem .15rem .7rem; font-size: .78rem; }
  .chip button { background: none; border: 0; color: #9aa1b8; cursor: pointer; font-size: .9rem; padding: 0 .35rem; }
  footer { padding: .8rem; background: #1b1e2b; border-top: 1px solid #2a2e40; display: flex; flex-wrap: wrap; gap: .5rem; }
  #chips:not(:empty) + footer { border-top: 0; }
  #prompt {
    flex: 1; min-width: 12rem; font: inherit; padding: .55rem .8rem; border-radius: 8px;
    border: 1px solid #3a3f58; background: #14161f; color: #e6e8ef;
  }
  footer button {
    font: inherit; padding: .55rem 1.1rem; border: 0; border-radius: 8px;
    background: #2f5af0; color: #fff; cursor: pointer;
  }
  footer button.icon { background: #262a3c; border: 1px solid #3a3f58; padding: .55rem .75rem; }
  footer button.icon.rec { background: #c0392b; border-color: #c0392b; animation: pulse 1.2s infinite; }
  footer button:disabled { opacity: .5; cursor: not-allowed; }
  #send:disabled { cursor: wait; }
  body.drag #log { outline: 2px dashed #2f5af0; outline-offset: -8px; }
  @keyframes pulse { 50% { opacity: .65; } }
  @media (prefers-reduced-motion: reduce) { footer button.icon.rec { animation: none; } }
</style>
</head>
<body>
<header>
  <h1>🦙 Local AI Chat</h1>
  <span id="mods">loading modules…</span>
  <label class="opt" title="Read each answer aloud"><input type="checkbox" id="speakChk"> speak replies</label>
  <label class="opt" title="Send automatically when you stop talking"><input type="checkbox" id="autoChk" checked> auto-send voice</label>
  <select id="lang" title="Voice language">
    <option value="en-US">English</option>
    <option value="ar-SA">العربية</option>
    <option value="fr-FR">Français</option>
    <option value="es-ES">Español</option>
    <option value="de-DE">Deutsch</option>
  </select>
  <button id="clearBtn" title="Delete stored chat history (DB)">🗑 clear</button>
</header>
<div id="log"></div>
<div id="chips"></div>
<footer>
  <select id="module"><option value="">no module</option></select>
  <button id="attachBtn" class="icon" title="Attach text or code files (or drop them on the page)">📎</button>
  <input type="file" id="fileInput" multiple hidden>
  <button id="micBtn" class="icon" title="Speak your message">🎤</button>
  <input id="prompt" placeholder="Ask something… (e.g. add https://example.com to test a module)" autofocus>
  <button id="send">Send</button>
</footer>

<script>
// If the page itself is served over HTTPS, use the HTTPS API to stay
// mixed-content free; plain HTTP page falls back to the plain API.
// Same-origin API first (served proxied by serve_https.py -> no CORS, works
// on localhost AND LAN IP). Fallback: the API server directly.
const API_CANDIDATES = [
  "",                          // https://<this-host>:8443/me/chat  (proxied)
  "http://localhost:8000",     // api_server in plain http (local only)
];
let API = API_CANDIDATES[0];
const log = document.getElementById("log");
const promptInput = document.getElementById("prompt");
const sendBtn = document.getElementById("send");
const moduleSel = document.getElementById("module");
const modsSpan = document.getElementById("mods");
const chipsBox = document.getElementById("chips");
const fileInput = document.getElementById("fileInput");
const micBtn = document.getElementById("micBtn");
const langSel = document.getElementById("lang");
const speakChk = document.getElementById("speakChk");
const autoChk = document.getElementById("autoChk");

// ---- file attachments (text/code only; read in the browser, sent inside the message) ----
const MAX_FILE_BYTES = 2_000_000;   // refuse files bigger than this
const MAX_TOTAL_CHARS = 12000;      // file text sent per message (small local models have small context)
const TEXT_EXT = /\.(txt|md|csv|tsv|json|ya?ml|xml|html?|css|js|ts|py|sh|c|h|cpp|java|go|rs|php|sql|log|conf|ini|toml|nft|rules|service|env)$/i;
let attachments = [];               // {name, size, text}

function add(cls, text) {
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function kb(n) { return n < 1024 ? n + " B" : (n / 1024).toFixed(1) + " KB"; }

function renderChips() {
  chipsBox.replaceChildren();
  attachments.forEach((a, i) => {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.textContent = `📎 ${a.name} (${kb(a.size)})`;
    const x = document.createElement("button");
    x.type = "button"; x.textContent = "✕"; x.title = "Remove";
    x.onclick = () => { attachments.splice(i, 1); renderChips(); };
    chip.appendChild(x);
    chipsBox.appendChild(chip);
  });
}

async function addFiles(files) {
  for (const f of files) {
    const looksText = f.type.startsWith("text/") || f.type === "application/json" || TEXT_EXT.test(f.name);
    if (!looksText) { add("note", `skipped ${f.name}: only text or code files are supported`); continue; }
    if (f.size > MAX_FILE_BYTES) { add("note", `skipped ${f.name}: larger than ${kb(MAX_FILE_BYTES)}`); continue; }
    const text = await f.text();
    if (text.includes("\u0000")) { add("note", `skipped ${f.name}: looks like a binary file`); continue; }
    attachments.push({ name: f.name, size: f.size, text });
  }
  renderChips();
}

function buildMessage(text) {
  let budget = MAX_TOTAL_CHARS, truncated = false;
  const parts = attachments.map(a => {
    let t = a.text;
    if (t.length > budget) { t = t.slice(0, Math.max(budget, 0)); truncated = true; }
    budget -= t.length;
    return `[[FILE ${a.name}]]\n${t}${t.length < a.text.length ? "\n…(truncated)" : ""}\n[[/FILE]]`;
  });
  return { message: text + (parts.length ? "\n\n" + parts.join("\n\n") : ""), truncated };
}

// Stored history contains the full file text; show only the file names when restoring.
function stripFiles(content) {
  const names = [...content.matchAll(/\[\[FILE ([^\]]*)\]\]/g)].map(m => m[1]);
  const clean = content.replace(/\n*\[\[FILE [^\]]*\]\][\s\S]*?\[\[\/FILE\]\]/g, "").trim();
  return clean + (names.length ? (clean ? "\n" : "") + "📎 " + names.join(", ") : "");
}

document.getElementById("attachBtn").addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", async () => { await addFiles(fileInput.files); fileInput.value = ""; });
window.addEventListener("dragover", e => { e.preventDefault(); document.body.classList.add("drag"); });
window.addEventListener("dragleave", e => { if (!e.relatedTarget) document.body.classList.remove("drag"); });
window.addEventListener("drop", async e => {
  e.preventDefault(); document.body.classList.remove("drag");
  if (e.dataTransfer.files.length) await addFiles(e.dataTransfer.files);
});

// ---- voice: speech input (mic) and speech output (read replies aloud) ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;

// default voice language = browser language when we offer it
const browserLang = (navigator.language || "en").slice(0, 2);
const match = [...langSel.options].find(o => o.value.startsWith(browserLang));
if (match) langSel.value = match.value;

if (!SR) {
  micBtn.disabled = true;
  micBtn.title = "Speech input is not supported in this browser (try Chrome, Chromium or Edge)";
}

function toggleMic() {
  if (!SR) return;
  if (listening) { rec.stop(); return; }
  speechSynthesis.cancel();
  rec = new SR();
  rec.lang = langSel.value;
  rec.interimResults = true;
  rec.continuous = false;
  const base = promptInput.value.trim() ? promptInput.value.trim() + " " : "";
  let finalText = "";
  rec.onresult = e => {
    let interim = "";
    finalText = "";
    for (let i = 0; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
    }
    promptInput.value = base + finalText + interim;
  };
  rec.onerror = e => {
    const hint = e.error === "not-allowed" ? " — allow the microphone for this site"
               : e.error === "network" ? " — Chrome speech recognition needs internet access"
               : e.error === "no-speech" ? " — nothing heard" : "";
    add("note", "mic: " + e.error + hint);
  };
  rec.onend = () => {
    listening = false;
    micBtn.classList.remove("rec");
    if (autoChk.checked && finalText.trim()) send();
  };
  try { rec.start(); listening = true; micBtn.classList.add("rec"); }
  catch (err) { add("note", "mic could not start: " + err.message); }
}

function speak(text) {
  if (!speakChk.checked || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const clean = text.replace(/```[\s\S]*?```/g, " (code block omitted) ").replace(/[*_`#>]/g, "");
  const chunks = clean.match(/[^.!?\n]+[.!?]*\s*/g) || [clean];   // short chunks avoid Chrome cutting long speech
  for (const c of chunks) {
    if (!c.trim()) continue;
    const u = new SpeechSynthesisUtterance(c.trim());
    u.lang = langSel.value;
    speechSynthesis.speak(u);
  }
}

micBtn.addEventListener("click", toggleMic);
speakChk.addEventListener("change", () => { if (!speakChk.checked) speechSynthesis.cancel(); });
langSel.addEventListener("change", () => { if (listening) rec.stop(); });

// ---- API / chat ----
async function pickApi() {
  for (const base of API_CANDIDATES) {
    try {
      const r = await fetch(base + "/modules", { signal: AbortSignal.timeout(4000) });
      if (r.ok) { API = base; return true; }
    } catch { /* try next */ }
  }
  API = API_CANDIDATES[0];
  return false;
}

async function loadModules() {
  const ok = await pickApi();
  if (!ok) { modsSpan.textContent = "could not reach API — start: python ai_server.py"; return; }
  try {
    const r = await fetch(API + "/modules");
    const data = await r.json();
    let skillNames = [];
    try {
      const sResp = await fetch(API + "/skills");
      const sData = await sResp.json();
      if (sData.skills) skillNames = sData.skills.map(s => s.name);
    } catch {}
    modsSpan.textContent = `api: ${API || "same origin"} · modules: ` + (data.modules.join(", ") || "none") + (skillNames.length ? ` · skills: ${skillNames.join(", ")}` : "");
    for (const m of data.modules) {
      const o = document.createElement("option");
      o.value = o.textContent = m;
      moduleSel.appendChild(o);
    }
  } catch { modsSpan.textContent = "could not load modules"; }
}

async function send() {
  if (sendBtn.disabled) return;
  let text = promptInput.value.trim();
  if (!text && !attachments.length) return;
  if (!text) text = "Please summarize the attached file(s).";

  const files = attachments;
  const { message, truncated } = buildMessage(text);
  add("user", text + (files.length ? "\n" + files.map(a => `📎 ${a.name} (${kb(a.size)})`).join("\n") : ""));
  if (truncated) add("note", `file text was cut to ${MAX_TOTAL_CHARS} characters so the model can handle it`);
  promptInput.value = "";
  attachments = []; renderChips();
  speechSynthesis.cancel();
  sendBtn.disabled = true;
  if (moduleSel.value) add("note", `running module: ${moduleSel.value}`);
  try {
    const r = await fetch(API + "/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        message,
        module: moduleSel.value || null,
        max_new_tokens: 512,
      }),
    });
    const data = await r.json();
    if (data.tools_used && data.tools_used.length) {
      for (const t of data.tools_used) {
        const argsStr = Object.entries(t.args || {}).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(", ");
        add("note", `🔧 [Tool] ${t.name}(${argsStr})`);
      }
    }
    if (data.response) { add("bot", data.response); speak(data.response); }
    else add("note", "Error: " + JSON.stringify(data));
  } catch (e) {
    add("note", "Request failed — start the API with:  python ai_server.py");
  }
  sendBtn.disabled = false;
  promptInput.focus();
}

async function loadHistory() {
  try {
    const r = await fetch(API + "/history");
    const data = await r.json();
    if (data.messages && data.messages.length) {
      for (const m of data.messages) {
        if (m.role === "user") {
          if (m.module) add("note", `[saved] ran module: ${m.module}`);
          add("user", stripFiles(m.content));
        } else if (m.role === "assistant") {
          add("bot", m.content);
        }
      }
      add("note", `restored ${data.messages.length} stored message(s) from history.db`);
    }
  } catch { /* history optional */ }
}

document.getElementById("clearBtn").addEventListener("click", async () => {
  try {
    await fetch(API + "/history", { method: "DELETE" });
    log.innerHTML = "";
    add("note", "history cleared (both this page and history.db)");
  } catch (e) {
    add("note", "could not clear history: " + e);
  }
});

sendBtn.addEventListener("click", send);
promptInput.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) send(); });
loadModules().then(loadHistory);
</script>
</body>
</html>
